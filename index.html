<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale agricolo</title>
<meta name="description" content="Gestionale agricolo: campi, colture, lavori, trattamenti e quaderno di campagna.">
<meta name="theme-color" content="#2f4538">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestionale">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #2f4538; overflow: hidden; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  /* il gestionale occupa tutto lo schermo, tolte le zone di notch e barra di sistema */
  #app { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
         width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
         border: 0; background: #f3f5f0; }
  #fondo { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom); background: #ffffff; }
  #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px; background: #2f4538; z-index: 2; transition: opacity .25s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; }
  #splash h1 { margin: 6px 0 0; font-size: 20px; font-weight: 650; letter-spacing: .02em; }
  #stato { margin: 0; opacity: .85; max-width: 34em; }
  #stato a, #stato button { color: #fff; }
  #splash button { margin-top: 8px; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; cursor: pointer; }
  .via { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="fondo"></div>
<div id="splash" role="status" aria-live="polite">
  <img src="icon-192.png" alt="">
  <h1>Gestionale agricolo</h1>
  <p id="stato">Apertura…</p>
</div>
<iframe id="app" title="Gestionale agricolo" allow="clipboard-read; clipboard-write; geolocation; camera; fullscreen"></iframe>
<script>
(function () {
  var stato = document.getElementById("stato"), splash = document.getElementById("splash"), app = document.getElementById("app");
  function dici(html) { stato.innerHTML = html; }
  /* codice dell'azienda dal link personale (…/?a=codice); se manca, l'ultimo usato su questo dispositivo */
  var a = "";
  try { a = (new URLSearchParams(location.search).get("a") || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12); } catch (e) {}
  try { if (a) localStorage.setItem("oliveta-a", a); else a = localStorage.getItem("oliveta-a") || ""; } catch (e) {}
  /* config.js si legge sempre fresco (GitHub Pages lo tiene in memoria fino a 10 minuti dopo una modifica) */
  var cfg = document.createElement("script");
  cfg.src = "config.js?t=" + Date.now();
  cfg.onload = function () { avvia(true); };
  cfg.onerror = function () { avvia(false); };
  document.head.appendChild(cfg);
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function avvia(letto) {
  var grezzo = String(window.OLIVETA_EXEC || "").replace(/\s+/g, "");
  /* accetta anche il link degli account Google Workspace, una barra finale e un ?a=codice in coda */
  var m = grezzo.match(/^(https:\/\/script\.google\.com\/(?:macros|a\/macros\/[^\/?#]+|a\/[^\/?#]+\/macros)\/s\/[\w-]+\/exec)\/?([?#].*)?$/);
  if (!m) {
    var giusto = "serve quello sotto «Link della web app, da scrivere nel file config.js» (gestionale › Aziende › App installabile), che inizia con <b>https://script.google.com/</b> e finisce con <b>/exec</b>";
    if (!letto) dici("Non trovo il file <b>config.js</b> su GitHub: deve stare nel repository accanto a index.html.");
    else if (window.OLIVETA_EXEC === undefined) dici("Il file <b>config.js</b> ha un errore di scrittura. Deve contenere una riga sola, con il link fra le virgolette: <b>window.OLIVETA_EXEC = \"https://script.google.com/…/exec\";</b>");
    else if (!grezzo || /INCOLLA-QUI/.test(grezzo)) dici("Manca il link della web app nel file <b>config.js</b>: " + giusto + ". Se l'hai appena salvato su GitHub, aspetta un paio di minuti e riapri.");
    else if (/github\.io/i.test(grezzo)) dici("In <b>config.js</b> c'è l'indirizzo del guscio (github.io): " + giusto + ".");
    else if (/\/dev\/?$/.test(grezzo)) dici("In <b>config.js</b> c'è il link di prova (finisce con /dev): " + giusto + ".");
    else dici("Il link in <b>config.js</b> non va bene: «" + esc(grezzo.slice(0, 120)) + "». " + giusto.charAt(0).toUpperCase() + giusto.slice(1) + ".");
    return;
  }
  var url = m[1];
  if (!a && m[2]) { try { a = (new URLSearchParams(m[2].replace(/^[?#]/, "")).get("a") || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12); } catch (e) {} }
  var dest = url + (a ? "?a=" + encodeURIComponent(a) : "");
  /* Safari e tutti i browser di iPhone/iPad bloccano i cookie di Google dentro una cornice (errore 401):
     lì il gestionale si apre direttamente, e si installa da quella pagina con «Aggiungi alla schermata Home». */
  var ua = navigator.userAgent || "", ios = /iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var soloWebKit = ios || (/AppleWebKit/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Android/.test(ua));
  function diretto(perche) {
    if (navigator.standalone) { /* icona del guscio già installata su iPhone: il gestionale va aperto in Safari */
      dici((perche || "") + "Su iPhone il gestionale si apre in Safari: <a href=\"" + dest + "\" target=\"_blank\" rel=\"noopener\">apri il gestionale</a>, poi Condividi › «Aggiungi alla schermata Home» e usa quella icona al posto di questa.");
      return;
    }
    dici((perche || "") + "Apertura…");
    location.replace(dest);
  }
  if (soloWebKit) { diretto(""); return; }
  /* negli altri browser: a tutto schermo nella cornice; se la pagina non dà segno di vita (cookie bloccati), apertura diretta */
  var pronto = false, guardia = null;
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.oliveta === "pronto") { pronto = true; clearTimeout(guardia); splash.classList.add("via"); setTimeout(function () { splash.hidden = true; }, 300); }
  });
  function apri() {
    if (!navigator.onLine) {
      dici("Senza rete: il gestionale si apre appena torna la connessione.");
      window.addEventListener("online", function () { location.reload(); }, { once: true });
      return;
    }
    dici("Apertura…");
    app.src = dest;
    guardia = setTimeout(function () { if (!pronto) diretto("Il browser non permette di aprirlo qui dentro. "); }, 25000);
    app.addEventListener("load", function () { clearTimeout(guardia); guardia = setTimeout(function () { if (!pronto) diretto("Il browser non permette di aprirlo qui dentro. "); }, 10000); }, { once: true });
  }
  apri();
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
